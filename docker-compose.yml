services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matriz
      POSTGRES_USER: matriz
      POSTGRES_PASSWORD: matriz
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run start:dev -w @matriz/api"
    volumes: [.:/workspace]
    environment:
      DATABASE_URL: postgresql://matriz:matriz@postgres:5432/matriz?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    volumes: [.:/workspace]
    ports: ["5173:5173"]
    depends_on: [api]
volumes: { postgres_data: {} }
