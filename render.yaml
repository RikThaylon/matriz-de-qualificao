# Render Blueprint — PostgreSQL is supplied securely by Neon, not by Render.
services:
  - type: web
    runtime: node
    name: matriz-qualificacao-api
    region: oregon
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build -w @matriz/api
    startCommand: npm run start:prod -w @matriz/api
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false # Cole no Render a connection string pooled do Neon com sslmode=require.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: matriz-qualificacao-realtime
          property: connectionString

  - type: web
    runtime: static
    name: matriz-qualificacao-web
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false # URL pública da API, por exemplo https://matriz-qualificacao-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: matriz-qualificacao-realtime
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Acesso externo bloqueado; somente a rede privada do Render.
